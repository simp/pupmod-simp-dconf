# The `simp:defaults` Sicura Compliance Engine profile.
#
# Enforcing it (Hiera `compliance_engine::enforcement: [simp:defaults]`)
# restores the dconf configuration this module managed by default before the
# v3 blast-radius refactor, without re-introducing any auto-opt-in into the
# module's own defaults. The profile lists its checks directly (no
# controls/CE indirection); the checks are defined in checks.yaml.
---
version: 2.0.0
profiles:
  simp:defaults:
    checks:
      simp:defaults.dconf.user_profile: true
      simp:defaults.dconf.tidy: true
